<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI 潜力监测工作台</title>
    <link rel="icon" href="/favicon.svg" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div>
          <p class="eyebrow">AI 开源项目 / 创业公司潜力监测</p>
          <h1>发现下一个值得销售触达和技术跟进的 AI 项目</h1>
        </div>
        <div class="top-actions">
          <button id="connectionsBtn" class="ghost">自动采集连接</button>
          <button id="refreshBtn" class="primary">刷新真实来源</button>
          <button id="exportBtn" class="ghost">导出 JSON</button>
        </div>
      </header>

      <main class="workspace">
        <aside class="panel sources-panel">
          <div class="panel-head">
            <h2>来源</h2>
            <span id="sourceCount" class="pill"></span>
          </div>
          <div class="segmented" role="group" aria-label="来源地区">
            <button data-region="all" class="active">全部</button>
            <button data-region="china">国内</button>
            <button data-region="overseas">海外</button>
            <button data-region="mixed">混合</button>
          </div>
          <input id="sourceSearch" class="input" placeholder="搜索平台 / 状态 / env" />
          <div id="sourcesList" class="sources-list"></div>
        </aside>

        <section class="center">
          <section class="panel controls">
            <div class="tabs" role="tablist">
              <button data-type="all" class="active">全部</button>
              <button data-type="open_source">开源项目</button>
              <button data-type="startup">创业公司</button>
            </div>
            <div class="filters">
              <input id="itemSearch" class="input" placeholder="搜索名称、证据、来源" />
              <select id="statusFilter" class="input">
                <option value="all">全部状态</option>
                <option value="new">新发现</option>
                <option value="watching">关注</option>
                <option value="researched">已研究</option>
                <option value="ignored">忽略</option>
              </select>
              <label class="checkline">
                <input id="sampleToggle" type="checkbox" checked />
                显示示例
              </label>
            </div>
          </section>

          <section id="runBanner" class="run-banner hidden"></section>
          <section id="itemsList" class="items-list"></section>
        </section>

        <aside class="right-rail">
          <section class="panel">
            <div class="panel-head">
              <h2>权重</h2>
              <button id="saveWeightsBtn" class="small">保存</button>
            </div>
            <p class="hint">基础权重是可调启发式，不是已验证预测模型；来源筛选后按证据覆盖率生成有效权重。</p>
            <div id="weightsPanel"></div>
          </section>

          <section class="panel import-panel">
            <div class="panel-head">
              <h2>手动导入</h2>
              <span id="modelBadge" class="pill"></span>
            </div>
            <form id="importForm">
              <div class="two">
                <select name="type" class="input">
                  <option value="startup">创业公司</option>
                  <option value="open_source">开源项目</option>
                </select>
                <select name="sourceId" id="importSource" class="input"></select>
              </div>
              <input name="name" class="input" placeholder="项目/公司名称" required />
              <input name="url" class="input" placeholder="来源 URL，可选" />
              <textarea name="text" class="input" rows="7" placeholder="粘贴正文、官网、招聘、媒体报道或社区讨论" required></textarea>
              <button class="primary full" type="submit">导入并抽取证据</button>
            </form>
          </section>
        </aside>
      </main>

      <section id="detailDrawer" class="drawer hidden" aria-live="polite"></section>
      <dialog id="connectionsDialog" class="connections-dialog">
        <div class="panel-head"><h2>自动采集连接</h2><button id="closeConnections" class="ghost" type="button">关闭</button></div>
        <form id="connectionsForm">
          <label>搜索与筛选关键词<textarea name="keywords" class="input" rows="3" placeholder="每行一个关键词"></textarea></label>
          <label>小红书 MCP 服务地址<input name="xhsBaseUrl" class="input" type="url" placeholder="http://127.0.0.1:18060" /></label>
          <p class="hint">小红书服务需先扫码登录。<a href="https://github.com/xpzouying/xiaohongshu-mcp" target="_blank" rel="noopener noreferrer">项目与登录说明</a></p>
          <label>WeWe RSS 服务地址<input name="weweBaseUrl" class="input" type="url" placeholder="http://127.0.0.1:4000" /></label>
          <label>公众号订阅 ID<textarea name="wechatFeedIds" class="input" rows="2" placeholder="all 或每行一个订阅 ID"></textarea></label>
          <p class="hint">在 WeWe RSS 扫码并添加公众号后自动更新。<a href="https://github.com/cooderl/wewe-rss" target="_blank" rel="noopener noreferrer">项目与订阅说明</a></p>
          <label>RSSHub 服务地址<input name="rsshubBaseUrl" class="input" type="url" placeholder="http://127.0.0.1:1200" /></label>
          <label>知乎作者主页或订阅路由<textarea name="zhihu" class="input" rows="2" placeholder="https://www.zhihu.com/people/作者ID"></textarea></label>
          <label>即刻圈子、用户主页或订阅路由<textarea name="jike" class="input" rows="2" placeholder="https://web.okjike.com/topic/圈子ID"></textarea></label>
          <label>抖音博主主页或订阅路由<textarea name="douyin" class="input" rows="2" placeholder="https://www.douyin.com/user/用户ID"></textarea></label>
          <label>B站订阅路由<textarea name="bilibili" class="input" rows="2" placeholder="每行一个 /bilibili/ 开头的订阅路由"></textarea></label>
          <label>36氪订阅路由<textarea name="36kr" class="input" rows="2" placeholder="每行一个 /36kr/ 开头的订阅路由"></textarea></label>
          <p class="hint"><a href="https://github.com/DIYgod/RSSHub" target="_blank" rel="noopener noreferrer">RSSHub 路由与部署说明</a> · 登录 Cookie 在采集服务中配置。</p>
          <p id="connectionsError" class="hint" role="alert"></p>
          <button type="submit" class="primary">保存连接</button>
        </form>
      </dialog>
      <div id="toast" class="toast hidden"></div>
    </div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
