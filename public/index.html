<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI 潜力监测</title>
    <link rel="icon" href="/favicon.svg" />
    <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/analysis.css" />
  <link rel="stylesheet" href="/chat.css" />
</head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="topbar-brand">
          <h1>AI 潜力监测</h1>
        </div>
        <nav class="phase-nav" role="tablist" aria-label="工作阶段">
          <button id="phaseCollectBtn" class="phase-tab active" data-phase="collect" type="button">① 采集</button>
          <button id="phaseAnalyzeBtn" class="phase-tab" data-phase="analyze" type="button">② 分析</button>
        </nav>
        <div class="top-actions">
          <button id="collectBtn" class="primary collect-header-btn" type="button">一键采集</button>
          <div id="collectProgress" class="collect-progress hidden" aria-live="polite">
            <div class="progress-ring" aria-hidden="true">
              <svg viewBox="0 0 36 36">
                <circle class="progress-ring-bg" cx="18" cy="18" r="15.9155" />
                <circle id="progressRingFill" class="progress-ring-fill" cx="18" cy="18" r="15.9155" />
              </svg>
              <span id="progressFraction" class="progress-fraction">0/0</span>
            </div>
            <div class="progress-copy">
              <strong id="progressSourceName">采集中</strong>
              <span id="progressDetail">准备开始…</span>
            </div>
          </div>
          <button id="exportBtn" class="ghost">导出</button>
          <a href="/collection.html" class="nav-link">数据源配置</a>
        </div>
      </header>

      <!-- ── Phase 1: Collect ── -->
      <div id="collectPhase" class="phase-view">
        <main class="workspace">
          <aside id="sourcesPanel" class="panel sources-panel">
            <div class="sources-collapsed-rail">
              <button id="expandSourcesBtn" class="sidebar-toggle" type="button" title="展开来源面板">☰</button>
              <span id="sourceCountCollapsed" class="collapsed-badge"></span>
            </div>
            <div class="sources-panel-body">
              <div class="panel-head sources-panel-head">
                <button id="collapseSourcesBtn" class="sidebar-toggle" type="button" title="折叠来源面板">‹</button>
                <h2>采集设置</h2>
                <span id="sourceCount" class="pill"></span>
              </div>
              <section class="source-section collect-options-section">
                <h3>采集参数</h3>
                <label class="field-label">
                  每个来源拉取
                  <select id="collectLimit" class="input">
                    <option value="12">12 条</option>
                    <option value="24">24 条</option>
                    <option value="50">50 条</option>
                    <option value="100">100 条</option>
                  </select>
                </label>
                <label class="field-label">
                  时间段
                  <select id="collectTimeRange" class="input">
                    <option value="1h">近 1 小时</option>
                    <option value="1d">近 1 天</option>
                    <option value="1w">近 1 周</option>
                    <option value="30d">近 30 天</option>
                    <option value="90d" selected>近 90 天</option>
                    <option value="all">不限</option>
                  </select>
                </label>
                <p id="collectOptionsHint" class="hint">GitHub 按创建时间、HN 按发帖时间、RSS/社交按发布时间过滤。</p>
              </section>
              <section class="source-section">
                <div class="source-section-head"><h3>账号登录</h3></div>
                <div id="sourcesList" class="sources-list"></div>
                <p id="sourceSelectionStatus" class="source-selection-status"></p>
              </section>
            </div>
          </aside>

          <section class="center collect-center">
            <section class="panel controls collect-controls">
              <div class="collect-panel-head">
                <div>
                  <h2>入库数据</h2>
                  <p class="hint">采集阶段展示全部入库条目，不做潜力筛选。切换到「分析」阶段进行评分与过滤。</p>
                </div>
                <span id="collectInventoryCount" class="pill"></span>
              </div>
              <div class="filter-row">
                <div class="search-input">
                  <span class="search-icon">⌕</span>
                  <input id="collectItemSearch" class="input" placeholder="搜索名称、来源…" />
                </div>
                <div id="collectSourceCombobox" class="combobox" data-key="collectItemSource"></div>
              </div>
            </section>
            <section id="runBanner" class="run-banner hidden"></section>
            <section id="collectItemsList" class="items-list collect-items-list"></section>
          </section>

          <aside class="right-rail collect-rail">
            <section class="panel">
              <div class="panel-head">
                <h2>入库概况</h2>
                <span id="coverageTotal" class="pill"></span>
              </div>
              <p class="hint">按来源地区统计当前全部入库条目。</p>
              <div id="coveragePanel"></div>
            </section>
            <section class="panel">
              <div class="panel-head"><h2>上次采集</h2></div>
              <div id="lastRunPanel" class="hint">尚无采集记录</div>
            </section>
          </aside>
        </main>
      </div>

      <!-- ── Phase 2: Analyze ── -->
      <div id="analyzePhase" class="phase-view hidden">
        <main class="workspace analyze-workspace">
          <section class="center analyze-center">
            <section class="panel controls analyze-controls">
              <div class="analyze-toolbar">
                <div class="tabs" role="tablist">
                  <button data-type="all" class="active">全部</button>
                  <button data-type="open_source">开源项目</button>
                  <button data-type="startup">创业公司</button>
                  <button data-type="lead">待识别线索</button>
                </div>
                <div class="search-input analyze-search">
                  <span class="search-icon">⌕</span>
                  <input id="itemSearch" class="input" placeholder="搜索…" />
                </div>
                <span id="filterSummary" class="analyze-count"></span>
              </div>
            </section>
            <section id="itemsList" class="items-list analyze-items"></section>
          </section>
        </main>
      </div>

      <section id="detailDrawer" class="drawer hidden" aria-live="polite"></section>
      <dialog id="xhsQrDialog" class="xhs-qr-dialog">
        <div class="panel-head">
          <h2>小红书扫码登录</h2>
          <button id="closeXhsQr" class="ghost" type="button">关闭</button>
        </div>
        <p id="xhsQrMessage" class="hint">正在请求登录二维码…</p>
        <div id="xhsQrSpinner" class="xhs-qr-spinner" aria-hidden="true"></div>
        <img id="xhsQrImage" class="xhs-qr-image" alt="小红书登录二维码" hidden />
        <div class="xhs-qr-actions">
          <button id="xhsQrRetry" class="ghost hidden" type="button">重新获取二维码</button>
        </div>
      </dialog>
      <dialog id="wechatQrDialog" class="xhs-qr-dialog">
        <div class="panel-head">
          <h2>微信公众号扫码登录</h2>
          <button id="closeWechatQr" class="ghost" type="button">关闭</button>
        </div>
        <p id="wechatQrMessage" class="hint">正在请求登录二维码…</p>
        <div id="wechatQrSpinner" class="xhs-qr-spinner" aria-hidden="true"></div>
        <img id="wechatQrImage" class="xhs-qr-image" alt="微信公众号登录二维码" hidden />
        <div class="xhs-qr-actions">
          <button id="wechatQrRetry" class="ghost hidden" type="button">重新获取二维码</button>
        </div>
      </dialog>
      <div id="toast" class="toast hidden"></div>
    </div>
    <script type="module" src="/app.js"></script>
    <script type="module" src="/chat.js"></script>
  </body>
</html>
